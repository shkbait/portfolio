<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <title>Supreme — Pages</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="stage">
    <section class="home" id="homeView" aria-label="Home">
      <button class="wordmark" id="homeButton" aria-label="Return home">
        <img src="logo.png" alt="Logo">
      </button>
      <div class="clockline" id="clockline">17/10/2026 02:47pm LDN</div>
      <nav class="menu" aria-label="Main navigation">
        <button data-section="news">news</button>
        <button data-section="preview">fall/winter 2026 preview</button>
        <button data-section="lookbook">fall/winter 2026 lookbook</button>
        <button data-section="gallery">gallery</button>
        <button data-section="random">random</button>
        <button data-section="about">about</button>
        <button data-section="stores">stores</button>
        <button data-section="contact">contact</button>
        <button data-section="mailing">mailing list</button>
      </nav>
      <div class="socials" aria-label="Social links">
        <a href="https://www.instagram.com/supremenewyork/" target="_blank" rel="noreferrer" aria-label="Instagram">◎</a>
        <a href="https://www.youtube.com/" target="_blank" rel="noreferrer" aria-label="YouTube">▶</a>
        <a href="https://www.facebook.com/" target="_blank" rel="noreferrer" aria-label="Facebook">f</a>
        <a href="https://open.spotify.com/" target="_blank" rel="noreferrer" aria-label="Spotify">◉</a>
        <a href="https://www.apple.com/apple-music/" target="_blank" rel="noreferrer" aria-label="Apple Music">Ⓐ</a>
        <a href="https://github.com/shkbait"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="GitHub">
        <svg viewBox="0 0 24 24" width="15" height="15"
              fill="currentColor"
              xmlns="http://www.w3.org/2000/svg">
          <path d="M12 .9a11.1 11.1 0 0 0-3.51 21.63c.55.1.76-.24.76-.54v-2.1c-3.1.67-3.76-1.32-3.76-1.32-.5-1.29-1.24-1.63-1.24-1.63-1.01-.69.08-.68.08-.68 1.12.08 1.71 1.15 1.71 1.15.99 1.7 2.6 1.21 3.23.92.1-.72.39-1.21.7-1.49-2.47-.28-5.07-1.24-5.07-5.5 0-1.22.44-2.21 1.15-2.99-.12-.28-.5-1.42.11-2.95 0 0 .94-.3 3.05 1.14a10.6 10.6 0 0 1 5.56 0c2.12-1.44 3.05-1.14 3.05-1.14.61 1.53.23 2.67.11 2.95.72.78 1.15 1.77 1.15 2.99 0 4.27-2.6 5.21-5.08 5.49.4.35.75 1.02.75 2.06v3.06c0 .3.2.65.77.54A11.1 11.1 0 0 0 12 .9Z"/>
        </svg>
      </a>
      </div>
      <button class="admin-trigger" id="adminTrigger" title="Page tools" aria-label="Page tools">+</button>
    </section>

    <section class="content-view hidden" id="contentView" aria-live="polite">
      <header class="content-header">
        <button class="mini-wordmark" id="miniHome">
          <img src="logo.png" alt="Logo">
          </button>
        <button class="back-button" id="backButton">close ×</button>
      </header>
      <div class="content-body">
        <div class="eyebrow" id="contentEyebrow">news</div>
        <h1 id="contentTitle">Loading…</h1>
        <div class="content-copy" id="contentCopy"></div>
        <div class="page-list" id="pageList"></div>
      </div>
    </section>
  </main>

  <dialog id="adminDialog" class="admin-dialog">
    <form method="dialog" class="dialog-top"><span>PAGE TOOLS</span><button class="dialog-close" value="cancel" aria-label="Close">×</button></form>
    <div class="admin-content">
      <label>API base URL<input id="apiBase" type="url" placeholder="http://127.0.0.1:8000" /></label>
      <div class="admin-actions"><button id="saveApi">save API</button><button id="setupDb">setup database</button><button id="refreshPages">refresh pages</button></div>
      <hr />
      <h2 id="editorHeading">Add page</h2>
      <label>Page ID (leave empty to add)<input id="pageId" type="number" min="1" placeholder="e.g. 3" /></label>
      <label>Title<input id="pageTitle" type="text" maxlength="180" placeholder="page title" /></label>
      <label>Main text<textarea id="pageText" rows="5" placeholder="Page content"></textarea></label>
      <div class="admin-actions"><button id="savePage">add page</button><button id="loadPage">load ID</button><button id="clearEditor">clear</button></div>
      <p class="admin-note" id="adminStatus">Connect this page to your FastAPI server.</p>
    </div>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
